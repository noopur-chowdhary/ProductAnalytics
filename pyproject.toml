[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "productpulse"
version = "0.1.0"
description = "Production-oriented product analytics, experimentation, propensity, uplift, and decision platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.12,<2",
  "pyarrow>=15,<30",
  "joblib>=1.3,<2",
  "PyYAML>=6,<7",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
